name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (slow, uses QEMU)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, home]
    # Postgres for Home's PG-backed tests (schema migrations, request-log
    # partitioning, concurrency admission); they are skipped without a DSN.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hometest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLIPROXY_HOME_TEST_POSTGRES_DSN: postgresql://postgres:ci@127.0.0.1:5432/hometest?sslmode=disable
      HOME_TEST_POSTGRES_DSN: postgresql://postgres:ci@127.0.0.1:5432/hometest?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            proxy/go.sum
            home/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test (with one rerun for known flaky tests)
        working-directory: ${{ matrix.module }}
        # Known flaky upstream tests (timing/SQLite locking), kept but retried:
        #   home/internal/proxyutil TestSOCKSTransportDialContextHonorsCancellation
        #   home/internal/cluster   TestOAuthConfigUpsertsPreserveConcurrentScopes
        run: |
          if go test -count=1 ./... 2>&1 | tee /tmp/test.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
          failed=$(grep -E '^(FAIL|---)' /tmp/test.log | grep -oE 'github.com/[^[:space:]]+' | sort -u || true)
          echo "::warning::first test run failed, rerunning failed packages: ${failed:-./...}"
          for attempt in 1 2 3; do
            go test -count=1 ${failed:-./...} && exit 0
            echo "::warning::rerun $attempt failed"
          done
          exit 1

  web:
    name: test (web panel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: home/go.mod
          cache: true
          cache-dependency-path: |
            proxy/go.sum
            home/go.sum
      - name: install
        working-directory: web
        run: npm ci
      - name: typecheck + unit tests
        working-directory: web
        run: npm run typecheck && npm test
      - name: build panel
        working-directory: web
        run: npm run build
      - name: build Home with the embedded panel
        run: |
          S=home/internal/managementasset/static
          find "$S" -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
          cp -R web/dist/. "$S/"
          cd home && go build -o /tmp/home ./cmd/home
      - name: start Home (SQLite)
        run: |
          mkdir -p /tmp/e2e/auths && cd /tmp/e2e
          cp "$GITHUB_WORKSPACE/home/config.example.yaml" config.yaml
          printf 'sqlite:\n  path: "home.db"\nnode:\n  external-ip: "127.0.0.1"\n  port: 18327\n' > cluster.yaml
          /tmp/home -import -auth-dir ./auths
          MANAGEMENT_PASSWORD=ci-e2e-key nohup /tmp/home > home.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18327/ >/dev/null 2>&1 && exit 0; sleep 1; done
          cat home.log; exit 1
      - name: playwright e2e
        working-directory: web
        env:
          PANEL_URL: http://127.0.0.1:18327
          MANAGEMENT_KEY: ci-e2e-key
          E2E_LOCAL: "1"
          SCREENSHOT_DIR: /tmp/e2e/shots
        run: |
          mkdir -p /tmp/e2e/shots
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-e2e
          path: |
            web/playwright-report
            web/test-results
            /tmp/e2e/shots
            /tmp/e2e/home.log
          if-no-files-found: ignore

  image:
    name: image (${{ matrix.component }})
    needs: [test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [proxy, home]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hcscq/cliproxy-google-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          platforms: ${{ (github.event_name == 'workflow_dispatch' && inputs.arm64) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
