name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      arm64:
        description: "Also build linux/arm64 (slow, uses QEMU)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, home]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: |
            proxy/go.sum
            home/go.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: go test (with one rerun for known flaky tests)
        working-directory: ${{ matrix.module }}
        # Known flaky upstream tests (timing/SQLite locking), kept but retried:
        #   home/internal/proxyutil TestSOCKSTransportDialContextHonorsCancellation
        #   home/internal/cluster   TestOAuthConfigUpsertsPreserveConcurrentScopes
        run: |
          if go test -count=1 ./... 2>&1 | tee /tmp/test.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then exit 0; fi
          failed=$(grep -E '^(FAIL|---)' /tmp/test.log | grep -oE 'github.com/[^ ]+' | sort -u || true)
          echo "::warning::first test run failed, rerunning failed packages: ${failed:-./...}"
          go test -count=1 ${failed:-./...}

  image:
    name: image (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [proxy, home]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hcscq/cliproxy-google-${{ matrix.component }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          platforms: ${{ (github.event_name == 'workflow_dispatch' && inputs.arm64) && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
