# Stateless proxy nodes (Home mode) as a Deployment. Scale freely (kubectl scale / HPA).
# Every pod self-enrolls at startup: it generates a fresh key, sends a CSR plus the
# reusable bootstrap token to Home and receives an ephemeral client certificate.
# Key/cert live only in an in-memory emptyDir and die with the pod; Home stores the
# identity in PostgreSQL and garbage-collects it once heartbeats stop
# (HOME_EPHEMERAL_NODE_TTL). If Home is unavailable the proxy retries with backoff.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  selector:
    app: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: cliproxy
      workload: deployment
  template:
    metadata:
      labels:
        app: cliproxy
        workload: deployment
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy}
      containers:
        - name: proxy
          image: ghcr.io/hcscq/cliproxy-google-proxy:sha-a2dac815e39cd0ebbdb4a74acba7462c6b17bb9c
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME_ADDRESS, value: "cliproxy-home.cliproxy.svc.cluster.local:8327"}
            - name: HOME_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: token}
            # Pins Home's cluster CA (sha256 of the CA cert DER, hex). Optional but recommended.
            - name: HOME_CA_FINGERPRINT
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: ca-fingerprint, optional: true}
            - name: HOME_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: HOME_CERT_DIR, value: /identity}
            - {name: WRITABLE_PATH, value: /tmp/cliproxy}
            - {name: HOME, value: /tmp}
          ports:
            - name: http
              containerPort: 8317   # port distributed by Home config (server.port)
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120   # Home may be restarting; the proxy retries with backoff
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: identity, mountPath: /identity}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cliproxy
