# Stateless proxy nodes (Home mode). 3 replicas.
# Kind is StatefulSet only to get stable ordinal pod names (cliproxy-0..2): Home requires a
# UNIQUE mTLS client identity per CPA node and enrollment secrets are single-use, so each
# ordinal maps to one pre-enrolled identity in Secret proxy-home-identities.
# No PVCs are used; the root filesystem is read-only and nothing is persisted locally.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy-headless
  namespace: cliproxy
spec:
  clusterIP: None
  selector:
    app: cliproxy
  ports:
    - name: http
      port: 8317
---
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  selector:
    app: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  serviceName: cliproxy-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cliproxy
  template:
    metadata:
      labels:
        app: cliproxy
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy}
      initContainers:
        # Select this pod's identity (<pod>.*) from the shared Secret.
        - name: select-identity
          image: busybox:1.36
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          command:
            - sh
            - -ec
            - |
              for f in jwt client-crt.pem client-key.pem home-ca-crt.pem; do
                test -s "/all/${POD_NAME}.${f}" || { echo "missing ${POD_NAME}.${f} in proxy-home-identities"; exit 1; }
                cp "/all/${POD_NAME}.${f}" "/identity/${f}"
              done
              chmod 400 /identity/*
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: all-identities, mountPath: /all, readOnly: true}
            - {name: identity, mountPath: /identity}
      containers:
        - name: proxy
          image: ghcr.io/hcscq/cliproxy-google-proxy:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME_JWT_FILE, value: /identity/jwt}
            - {name: HOME_CERT_DIR, value: /identity}
            - {name: WRITABLE_PATH, value: /tmp/cliproxy}
            - {name: HOME, value: /tmp}
            # stdout-only logging is the default; set CLIPROXY_FILE_LOGS=true to re-enable files.
          ports:
            - name: http
              containerPort: 8317   # port distributed by Home config (server.port)
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            # 503 until the Home client is connected and its heartbeat is healthy.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: identity, mountPath: /identity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: all-identities
          secret: {secretName: proxy-home-identities, defaultMode: 0400}
        - name: identity
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy
  namespace: cliproxy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cliproxy
