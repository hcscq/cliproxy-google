# Stateless proxy nodes (Home mode) as a Deployment. Scale freely (kubectl scale / HPA).
# Every pod self-enrolls at startup: it generates a fresh key, sends a CSR plus the
# reusable bootstrap token to Home and receives an ephemeral client certificate.
# Key/cert live only in an in-memory emptyDir and die with the pod; Home stores the
# identity in PostgreSQL and garbage-collects it once heartbeats stop
# (HOME_EPHEMERAL_NODE_TTL). If Home is unavailable the proxy retries with backoff.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
  namespace: cliproxy-google
spec:
  selector:
    app: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
  namespace: cliproxy-google
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: cliproxy
      workload: deployment
  template:
    metadata:
      labels:
        app: cliproxy
        workload: deployment
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy}
      containers:
        - name: proxy
          image: ghcr.io/hcscq/cliproxy-google-proxy:sha-684e98d5495b6b7c65b2a2dfcbfcb878db43ba7c
          imagePullPolicy: IfNotPresent
          env:
            - {name: GOMEMLIMIT, value: "1700MiB"}
            - {name: HOME_ADDRESS, value: "cliproxy-home.cliproxy-google.svc.cluster.local:8327"}
            - name: HOME_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: token}
            # Pins Home's cluster CA (sha256 of the CA cert DER, hex). Optional but recommended.
            - name: HOME_CA_FINGERPRINT
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: ca-fingerprint, optional: true}
            - name: HOME_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: HOME_CERT_DIR, value: /identity}
            - {name: WRITABLE_PATH, value: /tmp/cliproxy}
            - {name: HOME, value: /tmp}
            # Optional Home failover stickiness (defaults shown):
            # HOME_FAILOVER_STICK_COOLDOWN=2m  — after failover, refuse assigned pull-back
            # HOME_UNAVAILABLE_FORCE_SWITCH=8  — consecutive home_unavailable before force switch (0=off)
            # HOME_READY_GRACE=15s             — readyz stay-ready after last healthy heartbeat
            # HOME_READY_GRACE_UNHEALTHY=2s    — shorter grace when alternate Home exists
            # CPA_PPROF_ADDR=127.0.0.1:6060    — optional loopback pprof (not a Service port).
            #   kubectl port-forward deploy/cliproxy 6060:6060
            #   curl -s localhost:6060/debug/pprof/goroutine?debug=2
          ports:
            - name: http
              containerPort: 8317   # port distributed by Home config (server.port)
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 120   # Home may be restarting; the proxy retries with backoff
          livenessProbe:
            # /livez fails when the Home client lock or config lock is stuck.
            # /healthz stays shallow so startup is not coupled to that check.
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {memory: 2Gi}  # large (10-30MB) prompts OOM-killed 1Gi pods
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: identity, mountPath: /identity}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy
  namespace: cliproxy-google
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: cliproxy
