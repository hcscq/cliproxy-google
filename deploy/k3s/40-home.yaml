# Home control plane: 2 replicas. Home performs leader election and node discovery
# through PostgreSQL, so replicas are active/standby for scheduling and refresh.
# A StatefulSet (not a Deployment) gives every replica a stable DNS name that is
# used as its advertised host (node.external-ip) and baked into the server certificate
# and into the enrollment JWTs it issues.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy-home-headless
  namespace: cliproxy
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: cliproxy-home
  ports:
    - name: home
      port: 8327
---
# ClusterIP service for the Home Management API (HTTP on the same port as RESP/mTLS).
apiVersion: v1
kind: Service
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  selector:
    app: cliproxy-home
  ports:
    - name: home
      port: 8327
      targetPort: 8327
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  serviceName: cliproxy-home-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: cliproxy-home
  template:
    metadata:
      labels:
        app: cliproxy-home
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy-home}
      initContainers:
        - name: render-cluster-yaml
          image: busybox:1.36
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          command: ["sh", "-c", "sed \"s/__POD_NAME__/${POD_NAME}/g\" /tmpl/cluster.yaml.tmpl > /work/cluster.yaml && chmod 600 /work/cluster.yaml"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: cluster-tmpl, mountPath: /tmpl, readOnly: true}
            - {name: work, mountPath: /work}
      containers:
        - name: home
          image: ghcr.io/hcscq/cliproxy-google-home:latest
          imagePullPolicy: IfNotPresent
          workingDir: /work          # cluster.yaml, logs/ and plugins/ live here (emptyDir)
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: home-management, key: password}
          ports:
            - name: home
              containerPort: 8327
          # Home has no HTTP health endpoint; TCP checks on the multiplexed port.
          startupProbe:
            tcpSocket: {port: home}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: home}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: home}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cluster-tmpl
          secret: {secretName: home-cluster, defaultMode: 0400}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cliproxy-home
