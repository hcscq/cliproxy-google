# Home control plane as a stateless Deployment (2 replicas).
# - All state (config, credentials, cooldown/quota, concurrency, node identities,
#   leader lease) lives in PostgreSQL; replicas elect a master through PG.
# - Each replica advertises its pod IP (HOME_NODE_EXTERNAL_IP, downward API); its
#   server certificate is issued from the PG-stored cluster CA for that IP plus the
#   shared Service DNS names (HOME_SERVER_CERT_EXTRA_SANS), so proxies can dial any
#   replica through the ClusterIP Service. No per-replica stable DNS is needed.
# - Dead replicas' cluster rows / server certs are garbage collected by the master.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy-home
  namespace: cliproxy-google
spec:
  selector:
    app: cliproxy-home
  ports:
    - name: home
      port: 8327
      targetPort: 8327
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy-home
  namespace: cliproxy-google
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: cliproxy-home
      workload: deployment
  template:
    metadata:
      labels:
        app: cliproxy-home
        workload: deployment
    spec:
      # SIGTERM -> drain (proxies move away, <=HOME_DRAIN_TIMEOUT 25s) -> flush usage stream -> exit.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy-home}
      initContainers:
        # Home reads ./cluster.yaml from its working directory; copy it from the Secret.
        - name: copy-cluster-yaml
          image: ghcr.io/hcscq/cliproxy-google-home:sha-beebc281f4d12c324198c7dd5bfbcacae6439fb7  # has sh; matches live
          env:
            - {name: HOME_REDIS_ENABLED, value: "true"}
          command: ["sh", "-c", "cp /tmpl/cluster.yaml.tmpl /work/cluster.yaml && chmod 600 /work/cluster.yaml"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: cluster-tmpl, mountPath: /tmpl, readOnly: true}
            - {name: work, mountPath: /work}
      containers:
        - name: home
          image: ghcr.io/hcscq/cliproxy-google-home:sha-beebc281f4d12c324198c7dd5bfbcacae6439fb7
          imagePullPolicy: IfNotPresent
          workingDir: /work
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: home-management, key: password}
            - name: HOME_NODE_EXTERNAL_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: HOME_SERVER_CERT_EXTRA_SANS
              value: "cliproxy-home,cliproxy-home.cliproxy-google,cliproxy-home.cliproxy-google.svc,cliproxy-home.cliproxy-google.svc.cluster.local"
            # Reusable token that lets proxy replicas self-enroll (ephemeral identities).
            - name: HOME_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: token}
            # Ephemeral proxy identities without heartbeat for this long are revoked.
            - {name: HOME_EPHEMERAL_NODE_TTL, value: "10m"}
            # Per-node egress agents (46-egress-agent.yaml): every public IP on every egress node.
            - {name: HOME_EGRESS_AGENTS, value: "dns:cliproxy-egress-agent.cliproxy-google.svc.cluster.local:3141"}
            # Shared Redis layer (15-redis.yaml). "false" = PostgreSQL/in-memory only (deployed: true since phase 2).
            - {name: HOME_REDIS_ENABLED, value: "true"}
            # Request logs through a Redis stream (batch flush to PG; falls back to the
            # in-memory queue when Redis is down). "" / "0" = off.
            - {name: HOME_USAGE_STREAM, value: "1"}
            # Antigravity IDs upstream accepts but does not list in its catalog
            # (verified by direct upstream probe 2026-10-12); passed through unchanged.
            - {name: HOME_ANTIGRAVITY_EXTRA_MODELS, value: "gemini-3.8-flash-high,gemini-3.8-flash-low,gemini-3.8-flash-medium"}
            # Main PG pool through pgbouncer (12-pgbouncer.yaml); the lease pool stays
            # direct. "" = direct connections.
            - {name: HOME_PG_POOLER_ADDR, value: "pgbouncer.cliproxy-google.svc.cluster.local:6432"}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: redis-auth, key: password, optional: true}
          ports:
            - name: home
              containerPort: 8327
          startupProbe:
            tcpSocket: {port: home}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: home}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: home}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cluster-tmpl
          secret: {secretName: home-cluster, defaultMode: 0400}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy-home
  namespace: cliproxy-google
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cliproxy-home
