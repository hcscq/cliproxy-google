# Home control plane as a stateless Deployment (2 replicas).
# - All state (config, credentials, cooldown/quota, concurrency, node identities,
#   leader lease) lives in PostgreSQL; replicas elect a master through PG.
# - Each replica advertises its pod IP (HOME_NODE_EXTERNAL_IP, downward API); its
#   server certificate is issued from the PG-stored cluster CA for that IP plus the
#   shared Service DNS names (HOME_SERVER_CERT_EXTRA_SANS), so proxies can dial any
#   replica through the ClusterIP Service. No per-replica stable DNS is needed.
# - Dead replicas' cluster rows / server certs are garbage collected by the master.
apiVersion: v1
kind: Service
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  selector:
    app: cliproxy-home
  ports:
    - name: home
      port: 8327
      targetPort: 8327
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: cliproxy-home
      workload: deployment
  template:
    metadata:
      labels:
        app: cliproxy-home
        workload: deployment
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cliproxy-home}
      initContainers:
        # Home reads ./cluster.yaml from its working directory; copy it from the Secret.
        - name: copy-cluster-yaml
          image: busybox:1.36
          command: ["sh", "-c", "cp /tmpl/cluster.yaml.tmpl /work/cluster.yaml && chmod 600 /work/cluster.yaml"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: cluster-tmpl, mountPath: /tmpl, readOnly: true}
            - {name: work, mountPath: /work}
      containers:
        - name: home
          image: ghcr.io/hcscq/cliproxy-google-home:sha-2591c416cb1a347c1b57894cc15d872d2b12fd53
          imagePullPolicy: IfNotPresent
          workingDir: /work
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: home-management, key: password}
            - name: HOME_NODE_EXTERNAL_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: HOME_SERVER_CERT_EXTRA_SANS
              value: "cliproxy-home,cliproxy-home.cliproxy,cliproxy-home.cliproxy.svc,cliproxy-home.cliproxy.svc.cluster.local"
            # Reusable token that lets proxy replicas self-enroll (ephemeral identities).
            - name: HOME_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef: {name: home-bootstrap, key: token}
            # Ephemeral proxy identities without heartbeat for this long are revoked.
            - {name: HOME_EPHEMERAL_NODE_TTL, value: "10m"}
          ports:
            - name: home
              containerPort: 8327
          startupProbe:
            tcpSocket: {port: home}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: home}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: home}
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: cluster-tmpl
          secret: {secretName: home-cluster, defaultMode: 0400}
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cliproxy-home
  namespace: cliproxy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cliproxy-home
