# In-cluster PostgreSQL for the Home control plane (single instance).
# For production prefer a managed / external PostgreSQL (or an operator such as CloudNativePG):
# delete this file and point postgres_uri in 20-home-secret.example.yaml at it.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cliproxy-google
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cliproxy-google
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: cliproxy_home
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d cliproxy_home"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d cliproxy_home"]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path   # k3s default provisioner
        resources:
          requests:
            storage: 10Gi
