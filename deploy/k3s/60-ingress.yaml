# Live panel ingress for gai.vkm2.com (exported from ns cliproxy-google; apply-safe).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gai-vkm2-com
  namespace: cliproxy-google
spec:
  dnsNames:
  - gai.vkm2.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
  secretName: gai-vkm2-com-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: management-ratelimit
  namespace: cliproxy-google
spec:
  rateLimit:
    average: 20
    burst: 60
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cliproxy-google
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxy-home-panel
  namespace: cliproxy-google
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: cliproxy-google-management-ratelimit@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: gai.vkm2.com
    http:
      paths:
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /
        pathType: Exact
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /index.html
        pathType: Exact
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /management.html
        pathType: Exact
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /assets
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /v8/management
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /credentials
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /provider-keys
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /models
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /access-keys
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /groups
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /usage
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /logs
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /nodes
        pathType: Prefix
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /settings
        pathType: Prefix
  tls:
  - hosts:
    - gai.vkm2.com
    secretName: gai-vkm2-com-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxy-home-panel-http-redirect
  namespace: cliproxy-google
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: cliproxy-google-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: gai.vkm2.com
    http:
      paths:
      - backend:
          service:
            name: cliproxy-home
            port:
              number: 8327
        path: /
        pathType: Prefix
