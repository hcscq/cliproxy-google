# CPA Bright Data chain: cluster pods CONNECT here, then parent is the
# loopback relay bound to the node's secondary IP. Port 3142 is CPA's own
# (kiro uses 3129). Access log is off so usernames/passwords are not recorded.
http_port 3142

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access deny all

# The relay is the only parent and never_direct is set, so a parent marked dead
# turns every CONNECT on this node into a 503. The relay already retries the
# Bright Data connect internally; a high fail limit keeps a brief relay restart
# from taking the whole chain down, and a short connect timeout fails fast.
cache_peer 127.0.0.1 parent 44447 0 no-query proxy-only default login=PASSTHRU name=brightdata connect-timeout=5 connect-fail-limit=30
cache_peer_access brightdata allow all
never_direct allow all

cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
access_log none
cache_store_log none
cache_log stdio:/dev/stderr
logfile_rotate 0

forwarded_for delete
via off
httpd_suppress_version_string on
pid_filename none
coredump_dir /tmp
shutdown_lifetime 5 seconds
