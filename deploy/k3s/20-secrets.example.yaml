# EXAMPLE ONLY - copy to secrets.yaml, replace every CHANGE_ME, and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: cliproxy
type: Opaque
stringData:
  username: cliproxy
  password: CHANGE_ME_PG_PASSWORD
---
# Home cluster.yaml template. Home does not expand env vars, so the init container
# replaces __POD_NAME__ to give every Home replica a stable, unique advertised host
# (<pod>.cliproxy-home-headless...). The Home server certificate is issued for that name.
apiVersion: v1
kind: Secret
metadata:
  name: home-cluster
  namespace: cliproxy
type: Opaque
stringData:
  cluster.yaml.tmpl: |
    pgsql:
      postgres_uri: "postgresql://cliproxy:CHANGE_ME_PG_PASSWORD@postgres.cliproxy.svc.cluster.local:5432/cliproxy_home?sslmode=disable"
      slow-query-threshold: "200ms"
    node:
      external-ip: "__POD_NAME__.cliproxy-home-headless.cliproxy.svc.cluster.local"
      port: 8327
      heartbeat-interval: "5s"
      heartbeat-timeout: "20s"
      event-poll-interval: "3s"
---
apiVersion: v1
kind: Secret
metadata:
  name: home-management
  namespace: cliproxy
type: Opaque
stringData:
  # Management API key for Home (/v8/management/*). Used as MANAGEMENT_PASSWORD.
  password: CHANGE_ME_MANAGEMENT_KEY
---
# Per-node Home client identities for the proxy StatefulSet, produced by
# scripts/enroll-proxies.sh. Keys: <pod-name>.jwt, <pod-name>.client-crt.pem,
# <pod-name>.client-key.pem, <pod-name>.home-ca-crt.pem  (pod names cliproxy-0..N-1).
# Create it with the script instead of editing this example.
