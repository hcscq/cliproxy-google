# EXAMPLE ONLY - copy to secrets.yaml, replace every CHANGE_ME, and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: cliproxy
type: Opaque
stringData:
  username: cliproxy
  password: CHANGE_ME_PG_PASSWORD
---
# Home cluster.yaml (key name kept as cluster.yaml.tmpl). node.external-ip is overridden
# per pod by HOME_NODE_EXTERNAL_IP (pod IP), so the value here is only a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: home-cluster
  namespace: cliproxy
type: Opaque
stringData:
  cluster.yaml.tmpl: |
    pgsql:
      postgres_uri: "postgresql://cliproxy:CHANGE_ME_PG_PASSWORD@postgres.cliproxy.svc.cluster.local:5432/cliproxy_home?sslmode=disable"
      slow-query-threshold: "200ms"
    node:
      external-ip: "overridden-by-HOME_NODE_EXTERNAL_IP"
      port: 8327
      heartbeat-interval: "5s"
      heartbeat-timeout: "20s"
      event-poll-interval: "3s"
---
apiVersion: v1
kind: Secret
metadata:
  name: home-management
  namespace: cliproxy
type: Opaque
stringData:
  # Management API key for Home (/v8/management/*). Used as MANAGEMENT_PASSWORD.
  password: CHANGE_ME_MANAGEMENT_KEY
---
# Reusable bootstrap token for proxy self-enrollment (shared by Home and proxies).
# ca-fingerprint pins Home's cluster CA (optional; see README for how to read it).
apiVersion: v1
kind: Secret
metadata:
  name: home-bootstrap
  namespace: cliproxy
type: Opaque
stringData:
  token: CHANGE_ME_BOOTSTRAP_TOKEN
  ca-fingerprint: ""
