# Per-node egress proxy (squid, HTTP CONNECT only) that binds every outbound
# connection to the node's single secondary IPv4 on ens18, so each credential
# assigned to an egress always exits Google-facing traffic from one fixed IP.
# - Runs only on nodes labelled cliproxy.io/egress=true (nodes with a dedicated
#   secondary IP). Listens on the node's internal IP, port 3140 (kiro-rs uses
#   3128/3129 on the same IP; no conflict). Pod/LAN sources only, CONNECT :443 only.
# - Home lists these in proxy_pool (scope "egress") from HOME_EGRESS_PROXIES and
#   pins each credential to one of them (fail closed: never falls back to direct).
# - Master (7fm6r3az, 154.44.10.227): its host firewall (/usr/local/sbin/hostfw-restore.sh)
#   needs "-i ens19 -s 172.16.0.0/16 -p tcp --dport 3140 -j ACCEPT" (added 2026-10-12).
# Apply with the namespace used in prod:  sed 's/namespace: cliproxy$/namespace: cliproxy-google/'
apiVersion: v1
kind: ConfigMap
metadata:
  name: cliproxy-egress
  namespace: cliproxy
data:
  start.sh: |
    #!/bin/sh
    set -eu
    SRC=$(ip -4 addr show dev "${EGRESS_INTERFACE:-ens18}" | awk '/inet .*secondary/{split($2,a,"/");print a[1]}')
    n=$(echo "$SRC" | grep -c . || true)
    if [ "$n" != "1" ]; then echo "expected exactly one secondary IPv4 on ${EGRESS_INTERFACE:-ens18}, got: $SRC" >&2; exit 1; fi
    echo "egress source $SRC listen ${HOST_IP}:${EGRESS_PORT}"
    cat > /work/squid.conf <<CONF
    http_port ${HOST_IP}:${EGRESS_PORT}
    acl lan src 10.42.0.0/16 172.16.0.0/16 127.0.0.0/8
    acl SSL_ports port 443
    acl CONNECT method CONNECT
    http_access deny !CONNECT
    http_access deny CONNECT !SSL_ports
    http_access allow lan
    http_access deny all
    tcp_outgoing_address ${SRC}
    via off
    forwarded_for delete
    cache deny all
    cache_mem 0 MB
    max_filedescriptors 65536
    client_persistent_connections on
    server_persistent_connections on
    connect_timeout 15 seconds
    read_timeout 15 minutes
    shutdown_lifetime 5 seconds
    pid_filename /work/squid.pid
    coredump_dir /work
    access_log stdio:/dev/stdout squid
    cache_log stdio:/dev/stderr
    logfile_rotate 0
    CONF
    echo "$SRC" > /work/source-ip
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cliproxy-egress
  namespace: cliproxy
  labels:
    app: cliproxy-egress
spec:
  selector:
    matchLabels:
      app: cliproxy-egress
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cliproxy-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        cliproxy.io/egress: "true"
      terminationGracePeriodSeconds: 10
      initContainers:
        - name: discover
          image: busybox:1.36
          command: ["sh", "/scripts/start.sh"]
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: EGRESS_PORT
              value: "3140"
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: work, mountPath: /work}
      containers:
        - name: squid
          image: ubuntu/squid@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
          command: ["/usr/sbin/squid", "-f", "/work/squid.conf", "-NYC"]
          securityContext:
            runAsUser: 13
            runAsGroup: 13
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports:
            - {name: egress, containerPort: 3140, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: 3140}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 3140}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: squid-run, mountPath: /var/run/squid}
            - {name: squid-spool, mountPath: /var/spool/squid}
      volumes:
        - name: scripts
          configMap: {name: cliproxy-egress}
        - name: work
          emptyDir: {}
        - name: squid-run
          emptyDir: {}
        - name: squid-spool
          emptyDir: {}
